services:
  - type: web
    name: opmd-backend
    env: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --bind 0.0.0.0:$PORT --workers 1 --timeout 120 app:app
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
    disk:
      name: opmd-db
      mountPath: /data
      sizeGB: 1
